name: pocketbase_drift
description: A powerful, offline-first PocketBase client backed by a drift database.
version: 0.7.0
repository: https://github.com/DrDejaVuNG/pocketbase_drift
issue_tracker: https://github.com/DrDejaVuNG/pocketbase_drift/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  logging: ^1.3.0
  connectivity_plus: ">=6.0.0 <8.0.0"
  pocketbase: ^0.25.0
  drift: ^2.35.3
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.5.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.2

flutter:

flutter_scripts:
  schema: flutter pub run drift_dev schema dump lib/src/database/database.dart drift_schemas/

topics:
  - pocketbase
  - offline
  - cache
  - drift